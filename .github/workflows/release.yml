name: release
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
# J-16 release-merge（M2 §2.3）：tag/Release 触发 → npm publish --provenance。
# SBOM/SHA256SUMS/cosign 由 scripts/release-pipeline.ts 承载（本地/沙箱外轨，M3 §2.1.2 单源编译已入 CI j01）。
jobs:
  j16-release-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: Publish to npm with provenance
        # dist-tag 按版本形态动态选择：prerelease（如 1.0.0-rc.1）→ rc；稳定版（1.0.0）→ latest。
        # M5 §1.1 口径：1.0 发布时 latest→1.0.0，rc tag 保留指向 rc.1 不回指——稳定版禁止 --tag rc。
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if echo "$VERSION" | grep -q -- '-'; then TAG=rc; else TAG=latest; fi
          echo "version=$VERSION -> dist-tag=$TAG"
          npm publish --provenance --tag "$TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
