name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.19' }
      - run: node --experimental-transform-types --test test/*.spec.ts
      # N1 日志不变量断言已内嵌于测试（SessionLog.assertModelVisibleLogged）
      # S3 追加门禁：沙箱逃逸回归矩阵（tests/sandbox-escape）+ 密钥扫描 + 依赖审计

  # M5-S26（DEC-2 裁决接入）：Windows 四判据门禁——受限 token + Job Object 沙箱 spike，
  # 脚本退出码直连（任一判据 FAIL/SKIP 即非零）。1.0-GO-2 判据 1+2 / 1.0-GO-3 判据 3 的远端复核。
  win32-spike:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.19' }
      - run: npm install
      - run: node --experimental-transform-types scripts/win32-koffi-spike.ts
